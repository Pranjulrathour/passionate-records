<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF4444;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#FF0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="innerGradient" cx="50%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#FF0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC0000;stop-opacity:1" />
    </radialGradient>
    <style>
      .logo-text { fill: #FFFFFF; font-family: 'Arial Black', Arial, sans-serif; font-weight: 900; }
      .performer { fill: #000000; }
      .stars { fill: #FFFFFF; }
      .outer-ring { fill: none; stroke: #000000; stroke-width: 1; }
      .inner-ring { fill: none; stroke: #000000; stroke-width: 0.5; }
    </style>
  </defs>
  
  <!-- Outer background with gradient -->
  <circle cx="50" cy="50" r="49" fill="url(#bgGradient)"/>
  
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="47" class="outer-ring"/>
  
  <!-- Inner circle -->
  <circle cx="50" cy="50" r="35" fill="url(#innerGradient)"/>
  
  <!-- Inner ring -->
  <circle cx="50" cy="50" r="33" class="inner-ring"/>
  
  <!-- Stars around the top -->
  <g class="stars">
    <polygon points="35,20 36,23 39,23 37,25 38,28 35,26 32,28 33,25 31,23 34,23" />
    <polygon points="50,15 51,18 54,18 52,20 53,23 50,21 47,23 48,20 46,18 49,18" />
    <polygon points="65,20 66,23 69,23 67,25 68,28 65,26 62,28 63,25 61,23 64,23" />
  </g>
  
  <!-- Additional side stars -->
  <g class="stars">
    <polygon points="25,35 26,37 28,37 27,38 27,40 25,39 23,40 23,38 22,37 24,37" />
    <polygon points="75,35 76,37 78,37 77,38 77,40 75,39 73,40 73,38 72,37 74,37" />
  </g>
  
  <!-- Performer silhouette (simplified) -->
  <g class="performer">
    <!-- Head -->
    <circle cx="50" cy="35" r="3"/>
    <!-- Body -->
    <rect x="48" y="38" width="4" height="8" rx="1"/>
    <!-- Arms (one raised with microphone) -->
    <rect x="45" y="40" width="3" height="1" rx="0.5" transform="rotate(-30 46.5 40.5)"/>
    <rect x="52" y="40" width="3" height="1" rx="0.5" transform="rotate(45 53.5 40.5)"/>
    <!-- Legs -->
    <rect x="48" y="46" width="1.5" height="6" rx="0.5"/>
    <rect x="50.5" y="46" width="1.5" height="6" rx="0.5"/>
    <!-- Microphone -->
    <circle cx="54" cy="38" r="1"/>
  </g>
  
  <!-- Text: PASSIONATE -->
  <text x="50" y="60" text-anchor="middle" class="logo-text" font-size="8" letter-spacing="0.5">PASSIONATE</text>
  
  <!-- Text: RECORDS -->
  <text x="50" y="70" text-anchor="middle" class="logo-text" font-size="8" letter-spacing="0.5">RECORDS</text>
  
  <!-- Bottom decorative elements -->
  <g class="performer">
    <path d="M 30 75 Q 35 78 40 75" stroke="#000000" stroke-width="1" fill="none"/>
    <path d="M 60 75 Q 65 78 70 75" stroke="#000000" stroke-width="1" fill="none"/>
  </g>
</svg> 