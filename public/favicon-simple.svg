<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF4444;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#FF0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
    <style>
      .text { fill: #FFFFFF; font-family: Arial, sans-serif; font-weight: bold; font-size: 4px; }
      .performer { fill: #000000; }
    </style>
  </defs>
  
  <!-- Background -->
  <circle cx="16" cy="16" r="15" fill="url(#bgGrad)" stroke="#000000" stroke-width="0.5"/>
  
  <!-- Inner circle -->
  <circle cx="16" cy="16" r="11" fill="#FF0000" stroke="#000000" stroke-width="0.3"/>
  
  <!-- Simplified performer -->
  <g class="performer">
    <circle cx="16" cy="12" r="1.5"/>
    <rect x="15" y="13.5" width="2" height="4" rx="0.5"/>
    <rect x="13.5" y="15" width="1.5" height="0.5" transform="rotate(-20 14.25 15.25)"/>
    <rect x="17" y="15" width="1.5" height="0.5" transform="rotate(30 17.75 15.25)"/>
    <rect x="15.2" y="17.5" width="0.8" height="3"/>
    <rect x="16" y="17.5" width="0.8" height="3"/>
  </g>
  
  <!-- Simplified text -->
  <text x="16" y="23" text-anchor="middle" class="text">PR</text>
</svg> 